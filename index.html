<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 內容安全政策:本站是純前端靜態站,不呼叫任何後端 API,所以可以收得很緊。
         script-src 'self' → 即使某段解讀文字被注入 <script>,也不會被執行。
         style-src 需要 'unsafe-inline':雷達圖等 SVG 使用 style="" 屬性上色。
         img-src 需要 data:/blob::分享命卡的 QR Code 與截圖是在瀏覽器內產生的。
         connect-src 的 ws: 只給 Vite 開發模式的 HMR 用,正式站可以拿掉收得更緊。 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' ws: wss:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="description" content="免費線上紫微斗數與八字排盤:輸入生辰即得十二宮命盤、四柱八字、重點解讀與大限流年瀏覽。所有計算皆在瀏覽器內完成,生辰資料不會上傳。" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="紫微斗數・八字排盤|免費線上排盤與白話解讀" />
    <meta property="og:description" content="輸入生辰即得紫微命盤、八字四柱與白話重點解讀,並可產生專屬命卡分享。" />
    <meta property="og:locale" content="zh_TW" />
    <meta property="og:url" content="https://xciv0904.github.io/ziwei-bazi-engine/" />
    <!-- 分享預覽圖改用 JPEG:同一張 1200×630 的圖,PNG 要 1.0MB、JPEG(q88)只要 93KB。
         它不影響首屏(只有社群平台的爬蟲會抓),但每次建置與部署都要搬 1MB,repo 也一直背著。 -->
    <meta property="og:image" content="https://xciv0904.github.io/ziwei-bazi-engine/og-image-v2.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="紫微斗數與八字排盤的現代東方星盤視覺" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://xciv0904.github.io/ziwei-bazi-engine/" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#2b2621" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 中文字型是首屏最大的一筆下載。兩項調整:
         (1) 只留 style.css 實際用到的字重(serif 600/700、sans 400/500/600/700)——
             CJK 字檔很大,少一個字重就少下載一整份檔案。
         (2) 先以 media="print" 掛載:瀏覽器照樣下載,但不會擋住首次繪製;main.js 啟動後改回 all。
             搭配 display=swap,字型未到之前先用系統字顯示,不會出現整頁空白。 -->
    <link
      id="font-css"
      rel="stylesheet"
      media="print"
      href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" />
    </noscript>
    <title>紫微斗數・八字排盤</title>
    <script type="application/ld+json">
      {"@context":"https://schema.org","@type":"WebApplication","name":"紫微斗數・八字排盤","url":"https://xciv0904.github.io/ziwei-bazi-engine/","applicationCategory":"LifestyleApplication","operatingSystem":"Web","inLanguage":"zh-TW","description":"免費線上紫微斗數與八字排盤，所有計算皆在瀏覽器內完成。"}
    </script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳到主要內容</a>
    <div id="app" class="layout">
      <!-- ============ 側欄 ============ -->
      <aside class="sidebar">
        <div class="sidebar-head">
        <div class="brand">
          <div class="brand-icon">命</div>
          <div class="brand-title">紫微斗數<br />八字排盤</div>
        </div>
        <button id="sidebar-toggle" class="sidebar-toggle" type="button" aria-expanded="false" aria-controls="sidebar-body"><span aria-hidden="true">☰</span><span class="sidebar-toggle-label">輸入生辰</span></button>
        </div>
        <div id="sidebar-body" class="sidebar-body">
        <div class="divider"></div>

        <form id="birth-form">
          <div class="section-label">輸入生辰</div>
          <div id="chart-profile" class="chart-profile" hidden>
            <div><span>目前命盤</span><strong id="chart-profile-text"></strong></div>
            <button type="button" id="edit-chart-btn">修改</button>
          </div>
          <div class="field">
            <label for="name-input">姓名</label>
            <input id="name-input" type="text" placeholder="請輸入姓名" autocomplete="off" maxlength="20" />
          </div>
          <div class="field">
            <label>曆法</label>
            <div class="pill-group" id="cal-toggle">
              <button type="button" class="pill active" data-value="solar" aria-pressed="true">陽曆</button>
              <button type="button" class="pill" data-value="lunar" aria-pressed="false">農曆</button>
            </div>
          </div>
          <div class="field">
            <label for="birth-year">出生日期</label>
            <div class="date-parts">
              <input id="birth-year" type="text" inputmode="numeric" maxlength="4" placeholder="年" aria-label="出生年(西元4碼)" />
              <select id="birth-month" aria-label="出生月"></select>
              <select id="birth-day" aria-label="出生日"></select>
            </div>
            <div id="birth-date-error" class="field-error" hidden></div>
          </div>
          <div class="field">
            <label for="birth-hour">時辰</label>
            <select id="birth-hour"></select>
          </div>
          <div class="field">
            <label>性別</label>
            <div class="pill-group" id="gender-toggle">
              <button type="button" class="pill" data-value="male" aria-pressed="false">男</button>
              <button type="button" class="pill active" data-value="female" aria-pressed="true">女</button>
            </div>
          </div>
          <button type="submit" class="submit-btn">排盤</button>
          <button type="button" id="save-chart-btn" class="save-btn" hidden>☆ 儲存目前命盤</button>
        </form>

        <div id="saved-section" hidden>
          <div class="divider" style="margin-bottom:18px"></div>
          <div class="section-label">已存命盤</div>
          <div id="saved-list" class="saved-list"></div>
          <div class="saved-tools">
            <button type="button" id="export-charts" class="saved-tool-btn">匯出</button>
            <button type="button" id="import-charts" class="saved-tool-btn">匯入</button>
            <input type="file" id="import-file" accept="application/json" aria-label="選擇命盤收藏 JSON 檔案" hidden />
          </div>
        </div>

        <div class="divider"></div>

        <nav class="side-nav">
          <div class="section-label">核心排盤</div>
          <button class="nav-item active" data-view="dashboard">命盤總覽</button>
          <button class="nav-item" data-view="topics">主題分析</button>
          <button class="nav-item" data-view="report">重點解讀</button>
          <button class="nav-item" data-view="comprehensive">深度解析</button>
          <details class="more-tools">
            <summary>更多工具</summary>
            <div class="more-tools-list">
              <button class="nav-item" data-view="synastry">雙人合盤</button>
              <button class="nav-item" data-view="compare">命盤比對</button>
              <button class="nav-item" data-view="naming">姓名學</button>
              <button class="nav-item" data-view="metaphysics">進階玄學</button>
              <button class="nav-item" data-view="share">分享命卡</button>
              <a class="nav-item nav-external" href="./wiki/" target="_blank" rel="noopener">命理小百科 ↗</a>
            </div>
          </details>
        </nav>
        </div>
      </aside>

      <!-- ============ 主內容 ============ -->
      <main id="main-content" class="main" tabindex="-1">
        <div class="page-head">
          <h1 id="page-title">的命盤</h1>
          <div id="birth-summary" class="birth-summary"></div>
          <div class="reading-mode-toggle" id="reading-mode-toggle" hidden>
            <button type="button" class="mode-pill active" data-mode="public" aria-pressed="true">白話摘要</button>
            <button type="button" class="mode-pill" data-mode="study" aria-pressed="false">專業命盤</button>
          </div>
        </div>
        <section id="view-dashboard"></section>
        <section id="view-topics" hidden></section>
        <section id="view-report" hidden></section>
        <section id="view-comprehensive" hidden></section>
        <section id="view-synastry" hidden></section>
        <section id="view-compare" hidden></section>
        <section id="view-naming" hidden></section>
        <section id="view-metaphysics" hidden></section>
        <section id="view-share" hidden></section>

        <footer class="site-footer">
          本站內容由傳統命理規則自動組裝生成,僅供娛樂與文化參考,不構成醫療、財務或任何人生決策建議。
          所有排盤計算皆在你的瀏覽器內完成,生辰資料只儲存在本機,不會上傳到任何伺服器。
          <a href="https://github.com/xciv0904/ziwei-bazi-engine" target="_blank" rel="noopener">原始碼(GitHub)</a>
          <details class="method-note"><summary>排盤規則與精確度說明</summary><p>目前採用瀏覽器本機時間與傳統時辰排盤，支援 1900–2100 年。未校正出生地、時區與真太陽時；子時以午夜附近的傳統時辰規則處理。不同流派、換日與四化規則可能造成結果差異。若時辰不確定，系統會以午時暫排，紫微宮位與八字時柱僅供參考。</p></details>
        </footer>
      </main>
    </div>
    <button id="copy-ai-btn" class="copy-ai-btn" type="button" hidden>
      <span class="copy-ai-icon">AI</span>複製命盤解讀提示
    </button>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
