# 推到 main 分支即自動 build 並部署到 GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node test.js          # 排盤核心值回歸（唯一沒被 smoke 串進去的一支）
      # 這裡原本是逐支列出測試，旁邊還寫著「新增測試套件要記得加在這裡，否則它不會成為
      # 部署門檻——不會擋任何東西的測試只是裝飾」。那句話是對的，而它預言了自己的下場：
      # 實際清點時，smoke 串的 16 支裡只有 3 支在這份清單上，另外 13 支（readability、
      # text-quality、modifiers、reading-modes、topic-contracts…）全都不是門檻。
      # 也就是改壞解讀文案、寫出術語外洩、產生跨頁重複句，CI 一樣是綠的，直接上線。
      #
      # 靠人記得「新增測試要同步兩個地方」是行不通的——這份清單就是證據。
      # 改成直接跑 npm run smoke：它本身是 && 串接，第一支失敗就停，
      # CI log 一樣看得出是哪一支擋下來的，但從此不可能漏掉任何一支。
      # tests/prelaunch-review.mjs 另有一條檢查守住這一行不被改回逐支列舉。
      - run: npm run smoke         # 16 支測試套件（含 cross-test 三支、prelaunch、verify-test）
      - run: npm run build         # 先生成命理小百科靜態頁+sitemap,再 vite build(base './')
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
